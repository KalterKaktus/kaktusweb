<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#69f0ae">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KalterKaktus">
    <title>Anmelden - KalterKaktus</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a class="logo" href="/">KK</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/steam-deals/" class="nav-link">Steam Deals</a>
                <a href="/games/" class="nav-link">Games</a>
                <a href="/wiki/" class="nav-link">Wiki</a>
                <div id="auth-nav" class="auth-nav" aria-live="polite">
                    <a class="nav-link auth-link" href="/login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <main class="page-shell">
        <div class="page-container auth-page">
            <header class="page-header">
                <div>
                    <div class="page-kicker">KalterKaktus Account</div>
                    <h1 class="page-title">Anmelden</h1>
                    <p class="page-subtitle">

                    </p>
                </div>
            </header>

            <section class="auth-card" aria-labelledby="oauth-title">
                <div class="auth-oauth-buttons">
                    <button class="auth-oauth-btn is-google" id="oauth-google" type="button">
                        Mit Google anmelden
                    </button>
                </div>

                <div class="auth-divider" aria-hidden="true">
                    <span>oder</span>
                </div>

                <form id="auth-email-form" class="auth-email-form" autocomplete="on" method="post" action="#">
                    <label class="auth-field">
                        <span>E-Mail</span>
                        <input type="email" id="auth-email" name="email" autocomplete="email" required>
                    </label>
                    <label class="auth-field">
                        <span>Passwort</span>
                        <input type="password" id="auth-password" name="password" autocomplete="current-password" required minlength="6">
                    </label>
                    <div class="auth-form-actions">
                        <button class="auth-btn" type="submit" id="auth-email-signin">Anmelden</button>
                        <button class="auth-btn is-ghost" type="button" id="auth-email-signup">Account erstellen</button>
                    </div>
                </form>

                <p class="auth-status" id="auth-status" aria-live="polite"></p>
            </section>

        
        </div>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="/impressum.html">Impressum</a>
                <a href="/datenschutz.html">Datenschutz</a>
                <a href="/nutzungsbedingungen.html">Nutzungsbedingungen</a>
            </div>
        </div>
    </footer>

    <script src="/js/config.js"></script>
    <script type="module" src="/js/auth-nav.js"></script>
    <script type="module" src="/js/auth-login.js"></script>
</body>
</html>
