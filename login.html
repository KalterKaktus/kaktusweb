<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - KalterKaktus</title>
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a class="logo" href="/">KK</a>
            <div class="nav-links">
                <a href="/#home" class="nav-link">Home</a>
                <a href="/#about" class="nav-link">About</a>
                <a href="/free-games.html" class="nav-link">Free Games</a>
                <a href="/games/" class="nav-link">Games</a>
                <div id="auth-nav" class="auth-nav" aria-live="polite"></div>
            </div>
        </div>
    </nav>

    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <main class="page-shell">
        <div class="page-container auth-page">
            <header class="page-header">
                <div>
                    <div class="page-kicker">KalterKaktus Account</div>
                    <h1 class="page-title">Anmelden</h1>
                    <p class="page-subtitle">
                        Wir schicken dir einen Magic Link per E-Mail. Kein Passwort nötig.
                    </p>
                </div>
            </header>

            <section class="auth-card" aria-labelledby="login-title">
                <h2 id="login-title" class="auth-card-title">Magic Link</h2>
                <form id="magic-link-form" class="auth-form">
                    <label class="auth-label" for="auth-email">E-Mail</label>
                    <input
                        class="auth-input"
                        id="auth-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="deine@email.de"
                    >
                    <button class="auth-submit" type="submit">Link senden</button>
                </form>
                <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
            </section>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var code = params.get("code");
            if (!code) return;
            window.location.replace("/auth/callback.html?code=" + encodeURIComponent(code));
        })();
    </script>
    <script type="module" src="/js/auth-nav.js"></script>
    <script type="module" src="/js/auth-login.js"></script>
</body>
</html>
