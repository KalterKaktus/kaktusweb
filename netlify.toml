[functions]
  directory = "netlify/functions"

[build.environment]
  # These values are intentionally public in static pages/config and can match Netlify env values.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS,SUPABASE_URL"

[functions."check-free-games"]
  schedule = "@hourly"

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200

[[redirects]]
  from = "/nutzungsbedingungen"
  to = "/nutzungsbedingungen.html"
  status = 200

[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/free-games"
  to = "/steam-deals/"
  status = 301

[[redirects]]
  from = "/free-games/"
  to = "/steam-deals/"
  status = 301

[[redirects]]
  from = "/free-games.html"
  to = "/steam-deals/"
  status = 301
