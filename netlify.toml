[functions]
  directory = "netlify/functions"

[build]
  # Safety-Net: löscht alle Dev-Tools bevor publish. Auch wenn was versehentlich
  # in Git landet, kommt es nicht auf kalterkaktus.de an. Die find-Kommandos
  # geben exit 0 zurück auch wenn nichts gefunden wird.
  command = "find . -type f -name 'devPanel.js' -delete; find . -type f -name '*.dev.js' -delete; find . -type d -name '_dev' -exec rm -rf {} +; true"

[build.environment]
  # These values are intentionally public in static pages/config and can match Netlify env values.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAILS,SUPABASE_URL"

[functions."check-free-games"]
  schedule = "@hourly"

# Bilder und Schriften einmal laden, danach ein Jahr aus dem Browsercache.
# Ohne diesen Block liefert Netlify `max-age=0, must-revalidate` — der Browser
# fragt bei JEDEM Seitenaufruf nach, bekommt zwar nur ein 304 zurück, zahlt aber
# trotzdem die Latenz für jede Datei.
#
# ACHTUNG: `immutable` heißt, dass ein geänderter Inhalt unter demselben Namen
# NICHT ankommt. Wird ein Asset ausgetauscht, muss die Datei umbenannt werden
# (z. B. cactus-2.webp) — sonst sehen bestehende Spieler ein Jahr lang das alte.
[[headers]]
  for = "/games/KaktusClicker/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "https://wiki.kalterkaktus.de/*"
  to = "/wiki/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200

[[redirects]]
  from = "/nutzungsbedingungen"
  to = "/nutzungsbedingungen.html"
  status = 200

[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/free-games"
  to = "/steam-deals/"
  status = 301

[[redirects]]
  from = "/free-games/"
  to = "/steam-deals/"
  status = 301

[[redirects]]
  from = "/free-games.html"
  to = "/steam-deals/"
  status = 301
