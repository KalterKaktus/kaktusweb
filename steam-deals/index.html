<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#69f0ae">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KalterKaktus">
    <title data-i18n="deals.meta_title">Steam Deals - KalterKaktus</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .games-page {
            min-height: 100vh;
            padding: 8rem 2rem 5rem;
            position: relative;
            z-index: 1;
        }

        .games-container {
            max-width: 1180px;
            margin: 0 auto;
        }

        .games-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .games-kicker {
            color: var(--accent-light);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .games-title {
            font-size: clamp(2.2rem, 6vw, 4.8rem);
            line-height: 0.95;
            color: var(--text-primary);
        }

        .games-subtitle {
            color: var(--text-secondary);
            max-width: 620px;
            margin-top: 1rem;
            line-height: 1.7;
        }

        .back-link,
        .refresh-btn {
            border: 1px solid var(--border);
            color: var(--text-primary);
            background: var(--card-bg);
            border-radius: 999px;
            padding: 0.8rem 1rem;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .back-link:hover,
        .refresh-btn:hover {
            border-color: var(--accent-light);
            transform: translateY(-2px);
        }

        .games-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1rem;
        }

        .offer-section {
            margin-top: 2.5rem;
        }

        .offer-section:first-child {
            margin-top: 0;
        }

        .offer-section-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .offer-section-title h2 {
            color: var(--text-primary);
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .offer-section-title span {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .game-card {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-primary);
            text-decoration: none;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-light);
            background: var(--card-hover);
        }

        .game-card img {
            width: 100%;
            aspect-ratio: 460 / 215;
            object-fit: cover;
            background: var(--bg-secondary);
            display: block;
        }

        .game-card-body {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding: 1rem;
            flex: 1;
        }

        .game-card-title {
            font-size: 1.05rem;
            line-height: 1.35;
        }

        .game-card-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: auto;
        }

        .game-badge {
            border: 1px solid rgba(64, 224, 208, 0.35);
            background: rgba(64, 224, 208, 0.08);
            color: var(--accent-light);
            border-radius: 999px;
            padding: 0.35rem 0.55rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .game-badge.deal {
            border-color: rgba(255, 204, 102, 0.35);
            background: rgba(255, 204, 102, 0.08);
            color: #ffd166;
        }

        .game-price {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .source-link {
            color: var(--accent-light);
            font-weight: 700;
        }

        .state-box {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-secondary);
            padding: 2rem;
            text-align: center;
            line-height: 1.7;
        }

        .loader {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-light);
            border-radius: 50%;
            margin: 0 auto 1rem;
            animation: gameSpin 0.8s linear infinite;
        }

        @keyframes gameSpin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 760px) {
            .games-page {
                padding: 6.5rem 1rem 4rem;
            }

            .games-header,
            .games-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a class="logo" href="/">KK</a>
            <div class="nav-links">
                <a href="/" class="nav-link" data-i18n="nav.home">Home</a>
                <a href="/steam-deals/" class="nav-link" data-i18n="nav.steam_deals">Steam Deals</a>
                <a href="/games/" class="nav-link" data-i18n="nav.games">Games</a>
                <a href="/wiki/" class="nav-link" data-i18n="nav.wiki">Wiki</a>
                <div id="auth-nav" class="auth-nav" aria-live="polite">
                    <a class="nav-link auth-link" href="/login.html" data-i18n="nav.login">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>

    <main class="games-page">
        <div class="games-container">
            <header class="games-header">
                <div>
                    <div class="games-kicker" data-i18n="deals.kicker">Steam Angebote</div>
                    <h1 class="games-title" data-i18n="deals.title">Steam Deals</h1>
                    <p class="games-subtitle" data-i18n="deals.subtitle">
                        Kostenlose Steam-Spiele und beliebte Deals ab 70% Rabatt.
                    </p>
                </div>
                <a class="back-link" href="/" data-i18n="deals.back">Zurück</a>
            </header>

            <div class="games-toolbar">
                <div id="gamesMeta" data-i18n="deals.loading">Lade Angebote...</div>
                <button class="refresh-btn" id="refreshGames" type="button" data-i18n="deals.refresh">Aktualisieren</button>
            </div>

            <section id="gamesApp" class="state-box">
                <div class="loader"></div>
                <div data-i18n="deals.loading_full">Steam-Angebote werden geladen...</div>
            </section>
        </div>
    </main>

    <script type="module">
        import { t, onLanguageChange, ready as i18nReady } from '/js/i18n.js';
        const app = document.getElementById('gamesApp');
        const meta = document.getElementById('gamesMeta');
        const refreshButton = document.getElementById('refreshGames');

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderGame(game, options = {}) {
            const title = escapeHtml(game.title);
            const image = escapeHtml(game.image);
            const url = escapeHtml(game.url);
            const oldPrice = game.normalPrice ? escapeHtml(game.normalPrice) : 'Steam';
            const salePrice = game.salePrice ? `<span class="game-price">${escapeHtml(t('deals.now'))} ${escapeHtml(game.salePrice)}</span>` : '';
            const releaseDate = game.releaseDate ? `<span class="game-price">${escapeHtml(game.releaseDate)}</span>` : '';
            const reviewCount = Number(game.reviewCount) || 0;
            const reviewInfo = reviewCount
                ? `<span class="game-price">${escapeHtml(t('deals.reviews_info', { percent: game.reviewPercent, count: reviewCount.toLocaleString('de-DE') }))}</span>`
                : '';
            const badgeLabel = options.badgeLabel || t('deals.badge_free');
            const badgeClass = options.badgeClass || '';

            return `
                <a class="game-card" href="${url}" target="_blank" rel="noopener noreferrer">
                    <img src="${image}" alt="${title}" loading="lazy">
                    <div class="game-card-body">
                        <h2 class="game-card-title">${title}</h2>
                        <div class="game-card-meta">
                            <span class="game-badge ${badgeClass}">${escapeHtml(badgeLabel)}</span>
                            <span class="game-price">${escapeHtml(t('deals.instead_of'))} ${oldPrice}</span>
                            ${salePrice}
                            ${reviewInfo}
                            ${releaseDate}
                        </div>
                    </div>
                </a>
            `;
        }

        function renderSection(title, subtitle, offers, options = {}) {
            if (!offers.length) {
                return `
                    <section class="offer-section">
                        <div class="offer-section-title">
                            <h2>${escapeHtml(title)}</h2>
                            <span>${escapeHtml(subtitle)}</span>
                        </div>
                        <div class="state-box">${escapeHtml(options.emptyText || t('deals.empty_generic'))}</div>
                    </section>
                `;
            }

            return `
                <section class="offer-section">
                    <div class="offer-section-title">
                        <h2>${escapeHtml(title)}</h2>
                        <span>${offers.length} ${escapeHtml(t('deals.found'))}</span>
                    </div>
                    <div class="games-grid">
                        ${offers.map((offer) => renderGame(offer, options)).join('')}
                    </div>
                </section>
            `;
        }

        async function loadGames() {
            app.className = 'state-box';
            app.innerHTML = `<div class="loader"></div><div>${escapeHtml(t('deals.loading_full'))}</div>`;
            meta.textContent = t('deals.loading');
            refreshButton.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/steamfree');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                const games = Array.isArray(data.active) ? data.active : [];
                const discounted = Array.isArray(data.discounted) ? data.discounted : [];

                app.className = '';
                app.innerHTML = [
                    renderSection(t('deals.section_free'), t('deals.section_free_sub'), games, {
                        badgeLabel: t('deals.badge_free'),
                        emptyText: t('deals.empty_free'),
                    }),
                    renderSection(t('deals.section_popular'), t('deals.section_popular_sub'), discounted, {
                        badgeLabel: t('deals.badge_deal'),
                        badgeClass: 'deal',
                        emptyText: t('deals.empty_popular'),
                    }),
                ].join('');

                const locale = document.documentElement.lang === 'ru' ? 'ru-RU' : 'de-DE';
                const time = data.fetchedAt
                    ? new Date(data.fetchedAt).toLocaleString(locale)
                    : new Date().toLocaleString(locale);
                meta.innerHTML = `${t('deals.meta_summary', { free: games.length, deals: discounted.length, time })} <a class="source-link" href="https://store.steampowered.com/search/?specials=1" target="_blank" rel="noopener noreferrer">Steam Store</a>`;
            } catch (error) {
                app.className = 'state-box';
                app.innerHTML = `${escapeHtml(t('deals.error_load'))}<br>${escapeHtml(error.message)}`;
                meta.textContent = t('deals.error_meta');
            } finally {
                refreshButton.disabled = false;
            }
        }

        refreshButton.addEventListener('click', loadGames);
        // Erst laden wenn die Dictionaries da sind — sonst würde t() rohe Keys
        // liefern (z.B. "deals.error_load" statt der Fehlermeldung).
        i18nReady.then(loadGames);
        onLanguageChange(loadGames);
    </script>
    <script src="/js/config.js"></script>
    <script type="module" src="/js/auth-nav.js"></script>
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="/impressum.html" data-i18n="footer.impressum">Impressum</a>
                <a href="/datenschutz.html" data-i18n="footer.datenschutz">Datenschutz</a>
                <a href="/nutzungsbedingungen.html" data-i18n="footer.terms">Nutzungsbedingungen</a>
            </div>
        </div>
    </footer>
</body>
</html>
