<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#367c42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title data-i18n="garden.meta_title">KaktusGarden</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="assets/autotiles/02_grass/03_grass_on_dirt_02.png" type="image/png" />
    <link rel="preload" as="image" href="assets/characters/males/male_01/walk/male_01_walk_32x32_3frames.png" type="image/png" />
    <link rel="preload" as="font" type="font/woff2" href="/css/fonts/nunito-var-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/game-tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-cozy theme-pixel-garden garden-page">
    <div class="garden-loading" id="garden-loading" aria-live="polite" aria-busy="true">
      <div class="loading-card">
        <span class="loading-sprout" aria-hidden="true"></span>
        <h1 data-i18n="garden.loading_title">Der Garten wacht auf</h1>
        <p data-i18n="garden.loading_hint">Beete und Vorräte werden geladen…</p>
        <div class="loading-track"><span></span></div>
      </div>
    </div>

    <nav class="nav garden-site-nav">
      <div class="nav-container">
        <a class="logo" href="/">KK</a>
        <div class="nav-links">
          <a href="/" class="nav-link" data-i18n="nav.home">Home</a>
          <a href="/steam-deals/" class="nav-link" data-i18n="nav.steam_deals">Steam Deals</a>
          <a href="/games/" class="nav-link" data-i18n="nav.games">Games</a>
          <a href="/wiki/" class="nav-link" data-i18n="nav.wiki">Wiki</a>
          <div id="auth-nav" class="auth-nav" aria-live="polite">
            <a class="nav-link auth-link" href="/login.html" data-i18n="nav.login">Login</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="garden-shell">
      <h1 class="sr-only">KaktusGarden</h1>

      <div class="garden-stage" id="garden-stage">
        <canvas class="game-canvas" id="game-canvas" data-i18n-attr="aria-label:garden.world_label" aria-label="Dorf und Gärten"></canvas>

        <button class="hud-server" id="server-status" type="button" hidden
                data-i18n-attr="title:garden.copy_room_link" title="Raumlink kopieren">
          <strong id="server-name">Server –</strong>
          <span id="server-count">0/6</span>
          <span class="server-boost" id="server-boost">+0%</span>
        </button>

        <!-- Schnellreisen oben in der Mitte -->
        <nav class="hud-teleports" data-i18n-attr="aria-label:garden.teleports" aria-label="Schnellreise">
          <button class="hud-pill pill-shop" type="button" data-teleport="seeds">
            <span class="pill-icon icon-seeds" aria-hidden="true"></span>
            <span data-i18n="garden.tp_shop">Shop</span>
          </button>
          <button class="hud-pill pill-garden" type="button" data-teleport="garden">
            <span class="pill-icon icon-garden" aria-hidden="true"></span>
            <span data-i18n="garden.tp_garden">Garten</span>
          </button>
          <button class="hud-pill pill-sell" type="button" data-teleport="crops">
            <span class="pill-icon icon-coin" aria-hidden="true"></span>
            <span data-i18n="garden.tp_sell">Verkaufen</span>
          </button>
        </nav>

        <!-- Währungen oben rechts -->
        <div class="hud-wallet">
          <span class="hud-currency"><i class="hud-coin icon-coin" aria-hidden="true"></i><strong id="coin-count">0</strong></span>
          <span class="hud-currency"><i class="hud-coin icon-gem" aria-hidden="true"></i><strong id="gem-count">0</strong></span>
        </div>

        <!-- Menüspalte ganz rechts -->
        <div class="hud-menu" data-i18n-attr="aria-label:garden.menu" aria-label="Menü">
          <button class="hud-icon-button" type="button" id="profile-button" data-i18n-attr="aria-label:garden.menu_profile" aria-label="Profil">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.6 20.4c0-4.1 3.3-6.6 7.4-6.6s7.4 2.5 7.4 6.6z"/></svg>
          </button>
          <button class="hud-icon-button" type="button" id="stats-button" data-i18n-attr="aria-label:garden.menu_stats" aria-label="Statistik">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="12" width="4" height="8.5" rx="1.2"/><rect x="10" y="7" width="4" height="13.5" rx="1.2"/><rect x="16.5" y="3.5" width="4" height="17" rx="1.2"/></svg>
          </button>
          <button class="hud-icon-button" type="button" id="settings-button" data-i18n-attr="aria-label:garden.settings" aria-label="Einstellungen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm9 4.9v-3l-2.6-.5a6.9 6.9 0 0 0-.8-1.9l1.5-2.2-2.1-2.1-2.2 1.5a6.9 6.9 0 0 0-1.9-.8L12.5 2h-3l-.5 2.5a6.9 6.9 0 0 0-1.9.8L4.9 3.8 2.8 5.9l1.5 2.2a6.9 6.9 0 0 0-.8 1.9L1 10.5v3l2.5.5c.2.7.5 1.3.8 1.9l-1.5 2.2 2.1 2.1 2.2-1.5c.6.3 1.2.6 1.9.8l.5 2.5h3l.5-2.5c.7-.2 1.3-.5 1.9-.8l2.2 1.5 2.1-2.1-1.5-2.2c.3-.6.6-1.2.8-1.9z"/></svg>
          </button>
        </div>

        <!-- Kontext unten mittig: Infoschild und Aktionsknopf. Beide sind nur
             da, wenn es auf dem Feld unter den Füßen etwas zu tun gibt. -->
        <div class="hud-context">
          <div class="context-tag" id="context-tag" hidden>
            <span class="context-icon" id="context-icon" aria-hidden="true"></span>
            <span class="context-text">
              <strong id="context-title"></strong>
              <small id="context-sub"></small>
            </span>
          </div>
          <button class="hud-action" id="interact-button" type="button" hidden>
            <span class="hud-action-key" aria-hidden="true">E</span>
            <span id="interact-label"></span>
          </button>
        </div>

        <!-- Immer sichtbar, auch leer: nur hier wird ein Samen ausgewählt. -->
        <div class="hotbar" id="hotbar" data-i18n-attr="aria-label:garden.hotbar" aria-label="Tasche"></div>

        <div class="touch-pad" id="touch-pad" aria-hidden="true"></div>
      </div>
    </main>

    <div class="sheet-scrim" id="sheet-scrim" hidden></div>
    <section class="garden-sheet" id="garden-sheet" role="dialog" aria-modal="true" hidden>
      <button class="sheet-close" id="sheet-close" type="button" data-i18n-attr="aria-label:garden.close" aria-label="Schließen">×</button>
      <div class="sheet-content" id="sheet-content"></div>
    </section>

    <dialog class="garden-dialog" id="settings-dialog">
      <form method="dialog" class="dialog-card">
        <div class="dialog-heading">
          <h2 data-i18n="garden.settings">Einstellungen</h2>
          <button class="dialog-close" value="cancel" data-i18n-attr="aria-label:garden.close" aria-label="Schließen">×</button>
        </div>
        <p class="asset-credit" data-i18n="garden.asset_credit">Pixel-Assets: Super Retro Ranch von Gif.</p>
      </form>
    </dialog>

    <section class="garden-access" id="garden-access" role="alertdialog" aria-modal="true" hidden>
      <div class="access-card">
        <h2 id="access-title"></h2>
        <p id="access-message"></p>
        <a class="access-action" id="access-action" href="/games/" hidden></a>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/js/config.js"></script>
    <script type="module" src="/js/i18n.js"></script>
    <script type="module" src="/js/auth-nav.js"></script>
    <script type="module" src="js/game.js"></script>
  </body>
</html>
