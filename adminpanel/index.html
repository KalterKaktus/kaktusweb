<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#69f0ae">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KalterKaktus">
    <meta name="robots" content="noindex, nofollow">
    <title>Adminpanel - KalterKaktus</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/adminpanel/panel.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a class="logo" href="/">KK</a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/games/" class="nav-link">Games</a>
                <div id="auth-nav" class="auth-nav" aria-live="polite">
                    <a class="nav-link auth-link" href="/login.html?next=%2Fadminpanel%2F">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="page-shell admin-shell">
        <div class="page-container">
            <header class="page-header">
                <div>
                    <p class="page-kicker">KalterKaktus</p>
                    <h1 class="page-title">Adminpanel</h1>
                </div>
                <button class="primary-link admin-refresh" id="admin-refresh" type="button" hidden>Neu laden</button>
            </header>

            <p class="admin-status" id="admin-status" aria-live="polite">Adminzugriff wird geprüft...</p>
            <p class="admin-login-gate" id="admin-login-gate" hidden>
                <a class="primary-link" href="/login.html?next=%2Fadminpanel%2F">Mit Admin-Account einloggen</a>
            </p>
            <details class="admin-abuse" id="admin-abuse" hidden>
                <summary>Adminabuse</summary>
                <div class="admin-abuse-body">
                    <label class="admin-field admin-abuse-game">
                        <span>Game</span>
                        <select class="admin-input" id="admin-abuse-game">
                            <option value="kaktus-clicker">KaktusClicker</option>
                        </select>
                    </label>
                    <section class="admin-abuse-options" data-admin-abuse-game="kaktus-clicker">
                        <p class="admin-empty">Globale Events für Spieler, die gerade im Game online sind.</p>
                        <div class="admin-inline">
                            <button class="admin-button" data-admin-event="spawn-goldkaktus" type="button">Goldkaktus spawnen</button>
                            <button class="admin-button is-ruby" data-admin-event="spawn-rubinkaktus" type="button">Rubinkaktus spawnen</button>
                        </div>
                    </section>
                </div>
            </details>
            <section class="admin-users" id="admin-users" aria-live="polite" hidden></section>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script type="module" src="/js/auth-nav.js"></script>
    <script type="module" src="/adminpanel/panel.js"></script>
</body>
</html>
